<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>LeadFlow Manager</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;800&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // The stored theme has to be on the element before the first paint. Angular boots
    // too late: without this, every load flashes poster stock at someone who chose dark.
    // Mirrors ThemeService — keep the storage key and the values in step.
    (function () {
      try {
        var choice = localStorage.getItem('lf-theme') || 'system';
        var dark =
          choice === 'dark' ||
          (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
